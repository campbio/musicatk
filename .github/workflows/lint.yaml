# lintr — style and static checks across R/ and inst/shiny.
# inst/ is invisible to R CMD check, so this is the only guard on the Shiny app.
#
# CHANGED FILES ONLY. The package has never been linted: 2,922 lints as of the
# scaffolding PR (1,583 in R/, 1,336 in inst/). Rather than block every PR on
# that backlog, this job lints only the R files a PR (or push) touches, so new
# and edited code must be clean. Run `make lint` locally to see the full
# backlog; roughly half is mechanically fixable with `make style`. Switch back
# to lint_package() once the backlog is worked down.
on:
  push:
    branches: [devel, master]
  pull_request:
    branches: [devel, master]

name: lint

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed R files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          files=$(git diff --name-only --diff-filter=d "$base"...HEAD \
            -- 'R/*.R' 'inst/shiny/*.R' | tr '\n' ' ')
          echo "Changed R files: ${files:-none}"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        if: steps.changed.outputs.files != ''
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.changed.outputs.files != ''
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint changed files
        if: steps.changed.outputs.files != ''
        run: |
          files <- strsplit("${{ steps.changed.outputs.files }}", " ")[[1]]
          lints <- do.call(c, lapply(files, lintr::lint))
          print(lints)
          if (length(lints) > 0) {
            stop(length(lints), " lint(s) in changed files", call. = FALSE)
          }
        shell: Rscript {0}
