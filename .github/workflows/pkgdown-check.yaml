# Structural check of the pkgdown configuration ONLY.
# This never builds the site: tutorial builds are long and dependency-heavy, so
# rendering is a deliberate local maintainer action (make site-deploy).
# This job catches exported functions missing from the _pkgdown.yml reference
# index, and runs in seconds.
#
# BLOCKING. The 33 benchmarking topics missing at scaffolding time were added to
# the index (see dev/agent-log.md). Also mark this job as a required check in
# the GitHub branch protection settings.
on:
  pull_request:
    branches: [devel, master]

name: pkgdown-check

jobs:
  pkgdown-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Check pkgdown reference index
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}
