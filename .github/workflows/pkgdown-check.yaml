# Structural check of the pkgdown configuration ONLY.
# This never builds the site: tutorial builds are long and dependency-heavy, so
# rendering is a deliberate local maintainer action (make site-deploy).
# This job catches exported functions missing from the _pkgdown.yml reference
# index, and runs in seconds.
#
# NON-BLOCKING at first (continue-on-error): as of the scaffolding PR the package
# has 33 pre-existing missing topics, all from the benchmarking framework. Per the
# playbook scope guard those are triaged into an issue rather than fixed here.
# Flip to a required check once dev/agent-log.md's pkgdown finding is closed.
on:
  pull_request:
    branches: [devel, master]

name: pkgdown-check

jobs:
  pkgdown-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Check pkgdown reference index
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}
